<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3TB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cinzel:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0605;
    --bg-2: #120807;
    --card: #170A09;
    --oud-deep: #2B0709;
    --oud-mid: #7A121D;
    --oud-light: #D6535F;
    --oud-glow: #E1394A;
    --text: #F3E7E6;
    --text-dim: #BA9295;
    --hair: rgba(225,57,74,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(124,75,36,0.16), transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(44,27,16,0.5), transparent 70%),
      var(--bg);
    position: relative;
    overflow-x: hidden;
  }
  /* faint drifting smoke texture */
  body::before{
    content:"";
    position: fixed;
    inset: -10%;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(201,146,87,0.05), transparent 35%),
      radial-gradient(circle at 80% 70%, rgba(124,75,36,0.07), transparent 40%);
    filter: blur(40px);
    pointer-events: none;
    z-index: 0;
  }

  .card{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: linear-gradient(180deg, var(--card), var(--bg-2));
    border: 1px solid var(--hair);
    border-radius: 22px;
    padding: 44px 30px 34px;
    text-align: center;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,0.8),
      0 0 0 1px rgba(0,0,0,0.4) inset;
    opacity: 0;
    transform: translateY(14px) scale(0.98);
    animation: reveal 900ms cubic-bezier(.2,.8,.2,1) 120ms forwards;
  }
  @keyframes reveal{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; opacity: 1; transform: none; }
  }

  .avatar-wrap{
    width: 108px;
    height: 108px;
    margin: 0 auto 22px;
    position: relative;
  }
  .avatar-ring{
    position:absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from 180deg, var(--oud-mid), var(--oud-glow), var(--oud-deep), var(--oud-mid));
    opacity: 0.9;
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
            mask: radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
    animation: spin 9s linear infinite;
  }
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .avatar-ring{ animation: none; }
  }
  .avatar{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2A1B10, #0F0B07 75%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 44px;
    color: var(--oud-glow);
    letter-spacing: 1px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }

  .name{
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: 36px;
    letter-spacing: 4px;
    background: linear-gradient(135deg, var(--oud-light) 0%, var(--oud-glow) 45%, var(--text) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
    direction: ltr;
  }

  .tagline{
    font-family: 'Cinzel', serif;
    font-size: 12.5px;
    color: var(--oud-glow);
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 26px;
    line-height: 1.6;
  }

  .discord-chip{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    border: 1px solid var(--hair);
    background: rgba(255,255,255,0.02);
    margin-bottom: 26px;
  }
  .discord-chip-avatar{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3A0E11, #150707 75%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--oud-glow);
    flex-shrink: 0;
  }
  .discord-chip span{
    font-size: 12.5px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .divider{
    width: 64px;
    height: 1px;
    margin: 0 auto 28px;
    background: linear-gradient(90deg, transparent, var(--oud-mid), transparent);
    position: relative;
  }
  .divider::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:5px; height:5px;
    background: var(--oud-glow);
    border-radius: 50%;
    transform: translate(-50%,-50%) rotate(45deg);
  }

  .links{
    display:flex;
    flex-direction: column;
    gap: 12px;
  }
  .link{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 13px;
    border: 1px solid var(--hair);
    background: rgba(255,255,255,0.015);
    color: var(--text);
    text-decoration: none;
    font-size: 15.5px;
    font-weight: 500;
    transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;
  }
  .link:hover{
    border-color: rgba(201,146,87,0.55);
    background: rgba(201,146,87,0.06);
    transform: translateY(-1px);
  }
  .link:active{ transform: translateY(0px) scale(0.99); }
  .link svg{
    width: 20px; height: 20px;
    flex-shrink: 0;
    color: var(--oud-glow);
  }
  .link span{ flex: 1; text-align: left; }
  .link .handle{
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 400;
    direction: ltr;
  }

  .footer{
    margin-top: 30px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .footer-name{
    color: var(--oud-glow);
    font-weight: 600;
  }

  @media (max-width: 360px){
    .card{ padding: 36px 22px 28px; }
    .name{ font-size: 32px; }
  }
</style>
</head>
